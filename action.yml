name: Moat audit
description: Audit the current GitHub repository with Laravel Moat.

inputs:
  github_admin_token:
    description: Optional GitHub token with repository admin access. Defaults to GITHUB_TOKEN; pass secrets.GITHUB_ADMIN_TOKEN when needed.
    required: false
    default: ""
  fail_on_findings:
    description: Fail when Moat reports security findings.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install latest Moat release
      shell: bash
      run: |
        set -euo pipefail

        tag=$(curl -fsSL https://api.github.com/repos/laravel/moat/releases/latest | jq -er '.tag_name')
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        version=${tag#v}
        archive="moat-${version}-x86_64-unknown-linux-gnu.tar.gz"

        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/laravel/moat/releases/download/$tag/$archive"
        curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS" \
          "https://github.com/laravel/moat/releases/download/$tag/SHA256SUMS"
        (
          cd "$RUNNER_TEMP"
          awk -v archive="$archive" '$2 == archive' SHA256SUMS > moat-checksum.txt
          sha256sum --check --strict moat-checksum.txt
          tar -xzf "$archive"
        )

        echo "$RUNNER_TEMP/moat-${version}-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

    - name: Audit current repository
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_admin_token || github.token }}
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
      run: |
        set -euo pipefail
        case "$FAIL_ON_FINDINGS" in
          true|false) ;;
          *) echo "fail_on_findings must be 'true' or 'false'." >&2; exit 2 ;;
        esac

        report="$RUNNER_TEMP/moat-report.md"
        status=0
        moat "$GITHUB_REPOSITORY" --format markdown > "$report" 2>&1 || status=$?

        cat "$report"
        if grep -Fq '| ✕ fail |' "$report" || grep -Fq '| ! warn |' "$report"; then
          if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
            echo "Moat reported failures or warnings."
            exit 1
          fi

          echo "Moat reported findings; fail_on_findings is false."
          exit 0
        fi

        exit "$status"
