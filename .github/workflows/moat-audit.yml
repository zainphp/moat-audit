name: Moat audit

on:
  workflow_call:
    inputs:
      fail_on_findings:
        description: Fail when Moat reports security findings.
        required: false
        type: boolean
        default: true
    secrets:
      github_admin_token:
        description: Optional GitHub token with repository admin access.
        required: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run Moat audit action
        uses: zainphp/moat-audit@1
        with:
          fail_on_findings: ${{ inputs.fail_on_findings }}
          github_admin_token: ${{ secrets.github_admin_token }}
